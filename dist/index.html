<title>Car Régie 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Univers : une régie de car — panneaux graphite, touches rétroéclairées, tally rouge/vert, timecode ambre. */
:root {
  --bg: #0b0e11; --panel: #12171c; --panel2: #182027; --raise: #212a33; --line: #2c3640; --line2: #3a4652;
  --fg: #e8edf1; --muted: #93a0ab; --dim: #66727d;
  --amber: #ffb020; --amber-d: #5a3e08; --tally: #ff3b30; --tally-d: #4a0f0c; --pvw: #2fd25a; --pvw-d: #0d3d1b;
  --cyan: #46c6f2; --violet: #c77dff; --fibre: #ffd23f;
  --f-disp: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; display: block; }
#input-layer { position: fixed; inset: 0; z-index: 0; touch-action: none; }
.hidden { display: none !important; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
#hud > * { pointer-events: auto; }
.topbar { position: absolute; left: 0; right: 0; top: 0; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gut-r) 0 var(--gut-l); pointer-events: none; }
.topbar > * { pointer-events: auto; }
.brand { display: flex; flex-direction: column; gap: 2px; background: rgba(11,14,17,0.78); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; backdrop-filter: blur(6px); min-width: 0; }
.brand b { font-family: var(--f-disp); font-weight: 700; font-size: 18px; letter-spacing: 0.04em; text-transform: uppercase; }
.brand span { color: var(--muted); font-size: 12.5px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.tbtn { font-family: var(--f-disp); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; font-size: 13.5px; background: rgba(18,23,28,0.86); border: 1px solid var(--line2); color: var(--fg);
  border-radius: 5px; padding: 6px 10px; display: inline-flex; gap: 7px; align-items: center; backdrop-filter: blur(6px); }
.tbtn kbd { font-family: var(--f-mono); font-size: 10.5px; color: var(--amber); border: 1px solid var(--amber-d); border-radius: 3px; padding: 0 4px; }
.tbtn:hover { border-color: var(--amber); }
.tbtn.on { background: var(--amber-d); border-color: var(--amber); }
#crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none; }
#crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,0.75); }
#crosshair::before { left: 8px; top: 2px; width: 2px; height: 14px; } #crosshair::after { top: 8px; left: 2px; height: 2px; width: 14px; }
#prompt { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); background: rgba(11,14,17,0.86); border: 1px solid var(--amber); border-radius: 6px; padding: 7px 12px;
  font-family: var(--f-disp); font-size: 16px; letter-spacing: 0.03em; display: flex; gap: 10px; align-items: center; pointer-events: auto; white-space: nowrap; max-width: calc(100vw - 32px); }
#prompt kbd { font-family: var(--f-mono); background: var(--amber); color: #111; border-radius: 3px; padding: 1px 6px; font-weight: 600; }
#prompt small { color: var(--muted); font-family: var(--f-body); font-size: 12px; }
.statusbar { position: absolute; left: var(--gut-l); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; max-width: calc(100% - 340px); }
.chip { background: rgba(11,14,17,0.84); border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.chip b { font-family: var(--f-mono); font-weight: 600; color: var(--amber); }
.chip.red b { color: var(--tally); } .chip.green b { color: var(--pvw); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); display: inline-block; }
.dot.red { background: var(--tally); box-shadow: 0 0 8px var(--tally); } .dot.green { background: var(--pvw); } .dot.amber { background: var(--amber); }
#truckmap { position: absolute; left: var(--gut-l); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(330px, 46vw); background: rgba(11,14,17,0.82); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px 4px; backdrop-filter: blur(6px); cursor: pointer; }
#truckmap .tmap-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
#truckmap .tmap-head b { color: var(--fg); font-family: var(--f-disp); letter-spacing: .04em; text-transform: uppercase; }
.tmap-svg { width: 100%; height: auto; display: block; }
.tmap-zone { font: 600 9px var(--f-disp); fill: rgba(230,236,242,0.55); letter-spacing: .06em; }
.tmap-big .tmap-zone { font-size: 15px; }
.tmap-door { font: 600 12px var(--f-disp); fill: #30c060; }
.tmap-st circle { fill: #8a949e; stroke: #0b0d10; stroke-width: 1.5; cursor: pointer; }
.tmap-st:hover circle, .tmap-st:focus circle { fill: #ffb020; }
.tmap-st text { font: 600 11px var(--f-disp); fill: #e6ecf2; pointer-events: none; }
.tmap-me circle { fill: #30c0ff; stroke: #fff; stroke-width: 1.5; } .tmap-me path { fill: #30c0ff; }
.synwrap { background: #0b0e11; border: 1px solid var(--line); border-radius: 6px; overflow: auto; max-height: 72vh; }
.synwrap svg { display: block; width: 100%; min-width: 1100px; height: auto; }
.tmap-big { background: #0b0e11; border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; }
.tmap-big .tmap-svg { min-width: 760px; }
.tmap-zones { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.tmap-zone-card { border-left: 4px solid; background: var(--panel); border-radius: 4px; padding: 8px 10px; }
.tmap-zone-card h3 { margin: 0 0 4px; }
@media (pointer: coarse), (max-width: 700px) { #truckmap { bottom: auto; top: calc(150px + env(safe-area-inset-top, 0px)); width: min(260px, 60vw); } }
#minimon { position: absolute; right: var(--gut-r); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(320px, 42vw); aspect-ratio: 16/9; border: 2px solid var(--tally); border-radius: 3px; }
#minimon .lab { position: absolute; left: 6px; top: 5px; font-family: var(--f-disp); font-size: 12px; background: rgba(0,0,0,.7); padding: 1px 6px; border-radius: 2px; z-index: 1; }
#intercom { position: fixed; z-index: 5; left: var(--gut-l); bottom: calc(52px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.icm { background: rgba(11,14,17,0.9); border-left: 4px solid var(--amber); padding: 7px 10px; border-radius: 3px; font-size: 14px; animation: fadein .2s; }
.icm b { font-family: var(--f-disp); letter-spacing: 0.04em; color: var(--amber); margin-right: 6px; }
.icm.ok { border-color: var(--pvw); } .icm.bad { border-color: var(--tally); }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
#mission { position: absolute; left: var(--gut-l); top: calc(78px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100vw - 32px)); background: rgba(11,14,17,0.86); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; }
#mission .k { font-family: var(--f-disp); font-size: 12px; letter-spacing: 0.08em; color: var(--amber); text-transform: uppercase; }
#mission h4 { margin: 2px 0 4px; font-family: var(--f-disp); font-size: 17px; font-weight: 600; }
#mission p { margin: 0; color: #c7d0d7; font-size: 13px; line-height: 1.4; }
#mission .row { display: flex; gap: 8px; margin-top: 7px; }
#toast { position: absolute; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: rgba(11,14,17,0.92); border: 1px solid var(--line2); border-radius: 6px; padding: 8px 14px; max-width: min(560px, calc(100vw - 32px)); text-align: center; pointer-events: none; }
#toast.good { border-color: var(--pvw); } #toast.bad { border-color: var(--tally); }

/* ---------- Commandes tactiles ---------- */
#touch { position: absolute; inset: auto 0 0 0; height: 0; }
.joy { position: absolute; left: calc(var(--gut-l) + 10px); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(0,0,0,.25); touch-action: none; }
.joy i { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,176,32,.6); }
.tact { position: absolute; right: var(--gut-r); bottom: calc(200px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }

/* ---------- Panneaux génériques ---------- */
.overlay { position: fixed; inset: 0; z-index: 10; background: rgba(5,7,9,0.72); display: flex; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top,0px)) var(--gut-r) calc(16px + env(safe-area-inset-bottom,0px)) var(--gut-l); }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: min(980px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.sheet header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel2); }
.sheet header h2 { margin: 0; font-family: var(--f-disp); font-weight: 700; letter-spacing: 0.04em; font-size: 22px; text-transform: uppercase; flex: 1; text-wrap: balance; }
.sheet .body { overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.x { background: var(--raise); border: 1px solid var(--line2); border-radius: 5px; width: 34px; height: 34px; font-size: 18px; line-height: 1; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 6px 11px; font-family: var(--f-disp); letter-spacing: .04em; font-size: 14px; text-transform: uppercase; }
.tab.on { background: var(--amber-d); border-color: var(--amber); }
.prose { line-height: 1.55; max-width: 72ch; color: #d6dde3; }
.prose h3 { font-family: var(--f-disp); font-size: 18px; letter-spacing: .03em; margin: 14px 0 6px; color: var(--fg); }
.prose b { color: var(--fg); }
.steps { padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.tbl { border-collapse: collapse; font-size: 13px; min-width: 520px; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.tbl th { background: var(--panel2); font-family: var(--f-disp); letter-spacing: .03em; font-weight: 600; }
.tblwrap { overflow-x: auto; max-width: 100%; }
.formula { font-family: var(--f-mono); background: var(--panel2); border: 1px solid var(--line); padding: 8px 10px; border-radius: 4px; font-size: 12.5px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--f-mono); font-size: 12.5px; min-width: 0; overflow-wrap: anywhere; }
.btn { background: var(--raise); border: 1px solid var(--line2); border-radius: 5px; padding: 7px 12px; font-family: var(--f-disp); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 14px; }
.btn:hover { border-color: var(--amber); }
.btn.primary { background: var(--amber); color: #15100a; border-color: var(--amber); }
.btn.danger { border-color: #7a2621; color: #ffb3ad; }
.btn.small { padding: 4px 8px; font-size: 12.5px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); letter-spacing: .03em; }
select, input[type=text], input[type=number] { background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 6px 8px; min-width: 0; max-width: 100%; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.warn { color: #ffcf7a; } .err { color: #ff8a80; } .ok { color: #8cf0a8; }
.pill { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line2); border-radius: 999px; padding: 2px 8px; font-size: 12px; white-space: nowrap; }
.pill.ok { border-color: #1f7a3c; } .pill.err { border-color: #8a2a24; } .pill.warn { border-color: #8a6a1a; }

/* ---------- Écran d'accueil ---------- */
#start { position: fixed; inset: 0; z-index: 20; overflow: auto; background:
  radial-gradient(1200px 600px at 75% 10%, rgba(255,176,32,0.10), transparent 60%),
  linear-gradient(180deg, #0b0e11 0%, #0e1318 100%); }
#start .wrap { max-width: 1080px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top,0px)) var(--gut-r) calc(28px + env(safe-area-inset-bottom,0px)) var(--gut-l); display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; color: var(--amber); letter-spacing: .12em; text-transform: uppercase; display: flex; gap: 10px; align-items: center; }
.eyebrow .rec { width: 10px; height: 10px; border-radius: 50%; background: var(--tally); box-shadow: 0 0 10px var(--tally); animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .25; } }
#start h1 { font-family: var(--f-disp); font-weight: 700; font-size: clamp(38px, 7vw, 76px); line-height: .95; margin: 0; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
#start h1 em { font-style: normal; color: var(--amber); }
#start .lede { font-size: 17px; line-height: 1.55; color: #cbd3da; max-width: 66ch; margin: 0; }
.chain { display: flex; flex-wrap: wrap; gap: 0; align-items: stretch; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.chain div { flex: 1 1 120px; padding: 10px 12px; border-right: 1px solid var(--line); background: var(--panel); min-width: 0; }
.chain div:last-child { border-right: 0; }
.chain small { display: block; font-family: var(--f-mono); color: var(--dim); font-size: 11px; }
.chain b { font-family: var(--f-disp); font-size: 16px; letter-spacing: .03em; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.choice { text-align: left; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.choice:hover { border-color: var(--amber); }
.choice b { font-family: var(--f-disp); font-size: 20px; letter-spacing: .03em; text-transform: uppercase; }
.choice span { color: var(--muted); line-height: 1.45; font-size: 13.5px; }
.choice.main { border-color: var(--amber); background: linear-gradient(180deg, rgba(255,176,32,0.10), rgba(255,176,32,0.02)); }
.opts { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 18px; font-size: 13px; color: #c7d0d7; }
.keys kbd { font-family: var(--f-mono); font-size: 11.5px; color: var(--amber); border: 1px solid var(--amber-d); border-radius: 3px; padding: 0 5px; margin-right: 6px; }

/* ---------- Postes (stations) ---------- */
#station { position: fixed; inset: 0; z-index: 1; background: var(--bg); display: flex; flex-direction: column; }
#station .st-head { display: flex; gap: 12px; align-items: center; padding: calc(8px + env(safe-area-inset-top,0px)) var(--gut-r) 8px var(--gut-l); border-bottom: 1px solid var(--line); background: var(--panel2); flex-wrap: wrap; }
#station .st-head h2 { margin: 0; font-family: var(--f-disp); font-size: 21px; letter-spacing: .05em; text-transform: uppercase; }
#station .st-head .role { color: var(--muted); font-size: 13px; flex: 1 1 260px; min-width: 0; }
#station .st-body { flex: 1; overflow: auto; padding: 12px var(--gut-r) calc(16px + env(safe-area-inset-bottom,0px)) var(--gut-l); display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.monrow { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.mon { position: relative; aspect-ratio: 16/9; background: #000; border: 1px solid var(--line2); border-radius: 3px; max-width: 100%; }
.mon .tag { position: absolute; left: 0; top: -18px; font-family: var(--f-disp); font-size: 12.5px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
.mon.big { width: min(1100px, 100%); }
.mon.med { width: min(560px, calc(100vw - 40px)); }
.mon.sm { width: min(300px, calc(100vw - 40px)); }
.monwrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.monwrap > .lab { font-family: var(--f-disp); font-size: 13px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.hwpanel { background: linear-gradient(180deg, #1a2027, #141a20); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hwpanel h3 { margin: 0; font-family: var(--f-disp); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hwrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hwrow .rl { font-family: var(--f-disp); font-size: 13px; letter-spacing: .08em; width: 46px; color: var(--muted); }
.hw { min-width: 54px; height: 40px; padding: 0 6px; background: #252d36; border: 1px solid #3a4550; border-bottom-color: #10151a; border-radius: 4px; font-family: var(--f-disp); font-weight: 600; font-size: 13px; letter-spacing: .03em; color: #cfd8df; line-height: 1.05; }
.hw small { display: block; font-size: 10px; color: var(--dim); font-weight: 500; }
.hw:hover { border-color: #6a7682; }
.hw.pgm { background: var(--tally); color: #fff; border-color: #ff8a80; box-shadow: 0 0 12px rgba(255,59,48,.45); }
.hw.pst { background: var(--pvw); color: #04220e; border-color: #8cf0a8; box-shadow: 0 0 12px rgba(47,210,90,.35); }
.hw.lit { background: var(--amber); color: #1a1205; border-color: #ffd27a; box-shadow: 0 0 10px rgba(255,176,32,.4); }
.hw.lit2 { background: #1b4f73; border-color: var(--cyan); color: #e9f8ff; }
.hw.dead { opacity: .45; }
.hw.big { min-width: 86px; height: 56px; font-size: 18px; }
.panelgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.tbar { writing-mode: vertical-lr; direction: rtl; height: 170px; width: 46px; accent-color: var(--amber); }
.vfader { writing-mode: vertical-lr; direction: rtl; height: 160px; width: 34px; accent-color: var(--amber); }
input[type=range] { accent-color: var(--amber); max-width: 100%; }
.knob { display: flex; flex-direction: column; gap: 3px; min-width: 120px; flex: 1 1 140px; }
.knob label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; }
.knob label b { font-family: var(--f-mono); color: var(--fg); font-weight: 600; }
.lcd { font-family: var(--f-mono); background: #0a1208; color: #9dff8a; border: 1px solid #23401c; border-radius: 4px; padding: 6px 10px; font-size: 15px; letter-spacing: .04em; white-space: nowrap; }
.lcd.amber { background: #140e04; color: var(--amber); border-color: #4a3509; }
.lcd.big { font-size: 26px; }
.lcd.red { background: #1a0606; color: #ff8a80; border-color: #5a1a16; } .lcd.green { color: #8cf0a8; }
.strips { flex-wrap: nowrap; overflow-x: auto; align-items: stretch; gap: 8px; padding-bottom: 6px; }
.strip { width: 118px; flex: 0 0 118px; align-items: center; padding: 8px 6px; }
.strip h3 { font-size: 11.5px; min-height: 2.6em; text-align: center; line-height: 1.25; }
.hw.small { min-width: 0; padding: 4px 8px; font-size: 11.5px; }
.hw.pvw.lit { background: #ff9f43; border-color: #ff6b3d; box-shadow: 0 0 10px rgba(255,107,61,.6); }
canvas.scope { background: #05080a; border: 1px solid var(--line2); border-radius: 3px; width: 100%; max-width: 640px; aspect-ratio: 16/9; display: block; }
.splitcol { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 900px) { .splitcol { grid-template-columns: minmax(0,1fr); } .statusbar { max-width: 100%; bottom: calc(10px + 25vw); } }
.list { display: flex; flex-direction: column; gap: 6px; }
.item { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; min-width: 0; }
.item.sel { border-color: var(--amber); }
.item .grow { flex: 1; min-width: 0; }
.item .t { font-family: var(--f-disp); font-size: 15px; letter-spacing: .03em; }
.item .s { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.svgwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: #0d1115; }
.wheel { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, #3a434d, #1a1f25 70%); border: 2px solid #46515c; position: relative; touch-action: none; cursor: grab; }
.wheel i { position: absolute; left: 50%; top: 10px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--amber); }

/* ---------- Disposition des postes : écrans fixes (dock) + commandes défilantes ---------- */
.st-main { flex: 1; min-height: 0; display: grid; }
.st-main.top { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.st-main.side { grid-template-columns: minmax(0, 46%) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.st-main.none { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.st-dock { min-height: 0; min-width: 0; padding: 10px var(--gut-r) 10px var(--gut-l); background: #0d1115; display: flex; gap: 10px; overflow-y: auto; }
.st-main.top .st-dock { flex-direction: row; align-items: stretch; border-bottom: 1px solid var(--line); max-height: 50vh; --dockh: calc(50vh - 58px); }
.st-main.top.sm .st-dock { max-height: 36vh; --dockh: calc(36vh - 58px); }
.st-main.side .st-dock { flex-direction: column; border-right: 1px solid var(--line); padding-right: 12px; }
#station .st-main .st-body { min-width: 0; }
.st-main.side .st-body { padding-left: 14px; }
.dockrow { display: flex; gap: 10px; min-width: 0; align-items: flex-start; }
.st-main.top .st-dock > .dockrow, .st-main.top .st-dock > .monwrap { flex: 1 1 auto; min-width: 0; }
.monwrap.grow { flex: 1 1 0; min-width: 0; }
.refpair { display: flex; gap: 6px; } .refpair > .mon { flex: 1 1 0; min-width: 0; width: auto; }
.mon.fill { width: 100%; }
.st-main.top .mon.fill, .st-main.top canvas.scope.fill { width: min(100%, calc(var(--dockh) * 16 / 9)); max-width: none; }
.st-main.top .st-dock > .explain { flex: 0 0 min(360px, 32%); contain: size; min-height: 150px; }
.st-main.top .st-dock .hwpanel { max-height: var(--dockh); overflow: auto; }

.monwrap > .lab.labrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.labrow .meter { font-family: var(--f-mono); font-size: 11.5px; color: var(--amber); text-transform: none; letter-spacing: 0; }
.minibtn { font-family: var(--f-disp); font-size: 11.5px; letter-spacing: .05em; padding: 1px 7px; border-radius: 3px; background: var(--raise); border: 1px solid var(--line2); color: var(--muted); }
.minibtn.on { background: var(--amber); color: #1a1205; border-color: var(--amber); }
.hw.selcam { outline: 2px solid var(--amber); outline-offset: 2px; }
.st-main.side .st-dock > .explain { flex: 1 1 auto; min-height: 150px; }
.st-main.side .st-dock .ex-list { max-height: none; }
#station .st-body > * { flex-shrink: 0; }
.st-body > .explain .ex-list { max-height: 180px; }
.hwpanel.compact { padding: 8px 12px; gap: 6px; }
/* ---------- Fil « Ce qui se passe » ---------- */
.explain { background: #0f1418; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; overflow: hidden; }
.ex-h { font-family: var(--f-disp); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); display: flex; align-items: center; gap: 7px; }
.ex-list { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; min-height: 0; flex: 1; max-height: 230px; }
.st-main.top .st-dock .ex-list { max-height: none; }
.ex-item { font-size: 13px; line-height: 1.42; color: #d6dde3; padding: 5px 8px; border-left: 3px solid #2b5470; background: rgba(70,198,242,0.04); border-radius: 2px; animation: fadein .25s; }
.ex-item:first-child { border-left-color: var(--amber); background: rgba(255,176,32,0.09); color: var(--fg); }
.ex-item.warn { border-left-color: var(--tally); }
.ex-item.muted { color: var(--muted); border-left-color: var(--line2); background: none; }
.ex-tc { font-family: var(--f-mono); font-size: 11px; color: var(--dim); margin-right: 7px; }

/* ---------- Chaîne de traitement caméra ---------- */
.chainbox { display: flex; flex-direction: column; gap: 6px; }
.chainbox .ex-h { color: var(--muted); }
.chain-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.chain-cell { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; min-width: 0; transition: border-color .4s, background .4s; }
.chain-cell b { display: block; font-family: var(--f-disp); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chain-cell small { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chain-cell.hot { border-color: var(--amber); background: var(--amber-d); }
.chain-cell.hot b { color: var(--amber); }

/* ---------- Molettes et joystick RCP ---------- */
.rot { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 54px; user-select: none; -webkit-user-select: none; }
.rot-cap { border-radius: 50%; background: radial-gradient(circle at 40% 35%, #56616c, #20262c 72%); border: 3px solid #11161a; box-shadow: 0 2px 5px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14); position: relative; cursor: ns-resize; touch-action: none; }
.rot-cap i { position: absolute; left: 50%; top: 3px; bottom: 50%; width: 3px; margin-left: -1.5px; background: #e8edf1; border-radius: 2px; transform-origin: 50% 100%; }
.rot.red .rot-cap { border-color: #8a221c; } .rot.red .rot-cap i { background: #ff7a70; }
.rot.green .rot-cap { border-color: #1d6a34; } .rot.green .rot-cap i { background: #6fe08f; }
.rot.blue .rot-cap { border-color: #1f4f86; } .rot.blue .rot-cap i { background: #7fb8ff; }
.rot-l { font-family: var(--f-disp); font-size: 11.5px; letter-spacing: .05em; color: var(--muted); text-transform: uppercase; text-align: center; line-height: 1.1; }
.rot-val { font-family: var(--f-mono); font-size: 12px; color: var(--amber); }
.rot:focus-visible { outline: none; } .rot:focus-visible .rot-cap { outline: 2px solid var(--amber); outline-offset: 2px; }
.rjoy { position: relative; width: 132px; height: 132px; flex: none; touch-action: none; user-select: none; -webkit-user-select: none; }
.rjoy::before { content: ""; position: absolute; inset: 15%; border-radius: 50%; background: radial-gradient(circle, #2a3138, #14191d); border: 1px solid #0a0d10; }
.rjoy-ring { position: absolute; inset: 0; border-radius: 50%; cursor: ew-resize; -webkit-mask: radial-gradient(circle, transparent 57%, #000 58%); mask: radial-gradient(circle, transparent 57%, #000 58%); }
.rjoy-track { position: absolute; left: 50%; top: 24%; bottom: 24%; width: 12px; margin-left: -6px; background: #070a0c; border: 1px solid #39424b; border-radius: 6px; }
.rjoy-handle { position: absolute; left: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #ffe0a0, #c98a14 60%, #7a520a); border: 1px solid #3a2a08; box-shadow: 0 3px 8px rgba(0,0,0,.6); cursor: ns-resize; touch-action: none; }
.rjoy:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 50%; }

/* ---------- Pupitre RCP (façon RCP-3500) ---------- */
.rcp-host { flex: 1 1 100%; min-width: 0; max-width: 780px; }
.rcp { background: linear-gradient(180deg, #2b3137, #1c2126); border: 1px solid #3e4851; border-radius: 10px; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 8px 22px rgba(0,0,0,.35); }
.rcp-col { flex: 1 1 290px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.rcp-model { margin-left: auto; font-family: var(--f-disp); font-size: 12px; letter-spacing: .1em; color: #8a96a1; }
.rcp-leds { display: flex; gap: 8px; }
.rcp-led { font-family: var(--f-disp); font-size: 11px; letter-spacing: .1em; padding: 2px 9px; border-radius: 3px; background: #22100f; color: #6d4541; border: 1px solid #3a1a18; }
.rcp-led.tally.lit { background: var(--tally); color: #fff; box-shadow: 0 0 12px var(--tally); }
.rcp-led.call.lit { background: var(--amber); color: #111; animation: blink .5s infinite; }
.rcp-tabs { display: flex; gap: 3px; flex-wrap: wrap; }
.rcp-tab { font-family: var(--f-disp); font-size: 11.5px; letter-spacing: .04em; background: #101418; border: 1px solid #333c45; color: var(--muted); padding: 3px 7px; border-radius: 3px; }
.rcp-tab.on { color: #06131c; background: #8fd3ff; border-color: #8fd3ff; }
.rcp-lcd { background: #0b1923; border: 2px solid #04080b; border-radius: 4px; padding: 8px; font-family: var(--f-mono); font-size: 12.5px; color: #cdeaff; display: flex; flex-direction: column; gap: 5px; min-height: 118px; box-shadow: inset 0 0 18px rgba(70,198,242,.12); }
.rcp-lcd-top { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #1d3646; padding-bottom: 4px; }
.rcp-lcd-top b { color: #fff; }
.rcp-lcd-top .onair, .rcp-lcd-top .pvw { margin-left: auto; padding: 0 6px; border-radius: 2px; }
.rcp-lcd-top .onair { background: var(--tally); color: #fff; } .rcp-lcd-top .pvw { background: var(--pvw); color: #04220e; }
.rcp-lcd-row { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.rcp-lcd-row b { color: #8fd3ff; }
.rcp-lcd-row.wrap { flex-wrap: wrap; justify-content: flex-start; }
.rcp-lcd-row.wrap > span { width: 100%; color: #7fb4d6; font-size: 11px; }
.rcp-touch { background: #12293a; border: 1px solid #2b5470; color: #cdeaff; border-radius: 3px; padding: 3px 7px; font-family: var(--f-mono); font-size: 11.5px; }
.rcp-touch.on { background: #8fd3ff; color: #06131c; border-color: #8fd3ff; }
.rcp-encs { display: flex; justify-content: space-around; gap: 6px; min-height: 8px; }
.rcp-sec { font-family: var(--f-disp); font-size: 11px; letter-spacing: .14em; color: #8a96a1; border-top: 1px solid #3a434c; padding-top: 6px; }
.rcp-keys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.rcp-key { font-family: var(--f-disp); font-size: 11px; height: 30px; background: #1a1f24; border: 1px solid #3a434c; border-bottom-color: #0c1013; color: #aeb9c3; border-radius: 3px; padding: 0 2px; }
.rcp-key.on { background: #2d5a1f; color: #d8ffc8; border-color: #6dd04a; box-shadow: 0 0 8px rgba(109,208,74,.35); }
.rcp-knobs { display: flex; justify-content: space-around; }
.rcp-row { display: flex; gap: 5px; flex-wrap: wrap; }
.rcp-btn { flex: 1 1 0; min-width: 60px; height: 34px; font-family: var(--f-disp); font-weight: 600; font-size: 12.5px; letter-spacing: .04em; background: #252b31; border: 1px solid #434d57; border-bottom-color: #0f1316; color: #cfd8df; border-radius: 4px; }
.rcp-btn:hover, .rcp-key:hover, .lsm-key:hover { border-color: #7a8692; }
.rcp-btn.on { background: var(--amber); color: #1a1205; border-color: #ffd27a; box-shadow: 0 0 10px rgba(255,176,32,.4); }
.rcp-joyrow { display: flex; gap: 14px; align-items: center; justify-content: center; }
.rcp-iris { font-family: var(--f-mono); background: #0b1208; color: #9dff8a; border: 1px solid #23401c; border-radius: 4px; padding: 6px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 104px; }
.rcp-iris .big { font-size: 26px; font-weight: 600; } .rcp-iris .warn { color: #ffcf7a; }
.tbl.compact { min-width: 0; width: 100%; font-size: 12.5px; }
.tbl.compact th, .tbl.compact td { padding: 4px 6px; }
.tbl tr.sel td { background: rgba(255,176,32,0.10); }
.tbl tr.bad td { background: rgba(255,59,48,0.08); }
.tbl td.warn { color: #ffcf7a; } .tbl td.err { color: #ff8a80; } .tbl td.ok { color: #8cf0a8; }
.mono { font-family: var(--f-mono); white-space: nowrap; }
.tbl.cabtbl { min-width: 780px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--cyan); text-align: left; font: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
.linkbtn:hover { color: #9fe3ff; }

/* ---------- Télécommande LSM (façon LSM-VIA) ---------- */
.lsm { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.15fr); gap: 12px; background: linear-gradient(180deg, #2a2f35, #1a1e22); border: 1px solid #3c454e; border-radius: 12px; padding: 12px; align-items: start; }
.lsm-screen { background: #070b0e; border: 3px solid #0a0d10; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-shadow: inset 0 0 20px rgba(70,198,242,.08); }
.lsm-app { font-family: var(--f-mono); font-size: 11px; color: #8fd3ff; background: #0d1a24; padding: 3px 6px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lsm-clips { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.lsm-clip { background: #0f151a; border: 1px solid #25303a; border-radius: 3px; padding: 3px 5px; font-size: 11px; color: var(--dim); min-width: 0; }
.lsm-clip b { display: block; font-family: var(--f-mono); color: var(--muted); }
.lsm-clip span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lsm-clip.full { border-color: #2f7a3c; color: #bff5c9; } .lsm-clip.full b { color: var(--pvw); }
.lsm-trains { width: 100%; aspect-ratio: 760 / 210; display: block; border: 1px solid #1d2730; border-radius: 3px; cursor: crosshair; }
.lsm-sub { font-family: var(--f-disp); font-size: 11px; letter-spacing: .12em; color: #7d8a95; text-transform: uppercase; }
.lsm-pl { font-family: var(--f-mono); font-size: 11.5px; color: #cfe8ee; min-height: 18px; overflow-wrap: anywhere; }
.lsm-pad { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lsm-row { display: flex; gap: 5px; flex-wrap: wrap; }
.lsm-key { position: relative; flex: 1 1 44px; min-width: 42px; height: 42px; padding: 6px 5px 0; font-family: var(--f-disp); font-weight: 600; font-size: 12px; letter-spacing: .03em; background: #1c2126; color: #c9d3dc; border: 1px solid #3d4750; border-bottom: 3px solid #0d1013; border-radius: 4px; line-height: 1.05; }
.lsm-key small { display: block; font-size: 10px; color: var(--dim); font-weight: 500; }
.lsm-key::before { content: ""; position: absolute; left: 7px; right: 7px; top: 3px; height: 3px; border-radius: 2px; background: #39424b; }
.lsm-key.amber::before { background: var(--amber); } .lsm-key.cyan::before { background: var(--cyan); } .lsm-key.green::before { background: var(--pvw); } .lsm-key.violet::before { background: var(--violet); } .lsm-key.red::before { background: var(--tally); }
.lsm-key.on { background: #46525e; border-color: #8a96a1; color: #fff; }
.lsm-key.on.amber { background: var(--amber); color: #1a1205; border-color: #ffd27a; }
.lsm-key.on.cyan { background: #1b4f73; border-color: var(--cyan); }
.lsm-key.on.green { background: var(--pvw); color: #04220e; border-color: #8cf0a8; }
.lsm-key.on.violet { background: #5a2d80; border-color: var(--violet); }
.lsm-key.on.red { background: var(--tally); color: #fff; border-color: #ff8a80; box-shadow: 0 0 10px rgba(255,59,48,.4); }
.lsm-key.on small { color: inherit; }
.lsm-right { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.lsm-lever { height: 210px; width: 52px; }
@media (max-width: 1250px) { .lsm { grid-template-columns: minmax(0, 1fr) auto; } .lsm-screen { grid-column: 1 / -1; } }
.lsm-lcd { background: #0b1208; border: 2px solid #04080b; border-radius: 4px; padding: 6px 10px; font-family: var(--f-mono); font-size: 13px; color: #9dff8a; line-height: 1.5; white-space: pre; overflow: hidden; box-shadow: inset 0 0 14px rgba(47,210,90,.12); }
.lsm-cfg { font-size: 12px; color: #b9c7d2; }
.lsm-key small { display: block; font-size: 9.5px; color: #7d8a95; font-weight: 500; letter-spacing: .02em; }
/* pupitre ICP (mélangeur XVS) */
.icp-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.icp-head h3 { flex: 1 1 auto; }
.xpt-row { display: flex; gap: 4px; align-items: stretch; flex-wrap: wrap; }
.xpt-row .rl { width: 64px; align-self: center; }
.xpt { display: flex; flex-direction: column; align-items: stretch; gap: 2px; min-width: 52px; width: 52px; padding: 0; background: #1d2228; border: 1px solid #3a4550; border-bottom: 3px solid #0d1013; border-radius: 4px; overflow: hidden; }
.xpt .oled { display: block; background: #05080a; color: #8fd3ff; font-family: var(--f-mono); font-size: 10px; padding: 2px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.xpt .xn { font-family: var(--f-disp); font-weight: 700; font-size: 15px; color: #cfd8df; line-height: 1.3; }
.xpt small { font-size: 9px; color: var(--dim); padding-bottom: 2px; white-space: nowrap; overflow: hidden; }
.xpt:hover { border-color: #6a7682; }
.xpt.key.on { background: #6a4f0a; border-color: #ffd27a; } .xpt.key.on .xn { color: #ffe3a0; }
.xpt.pgm.on { background: var(--tally); border-color: #ff8a80; box-shadow: 0 0 12px rgba(255,59,48,.45); } .xpt.pgm.on .xn, .xpt.pgm.on small { color: #fff; }
.xpt.pst.on { background: var(--pvw); border-color: #8cf0a8; box-shadow: 0 0 12px rgba(47,210,90,.35); } .xpt.pst.on .xn, .xpt.pst.on small { color: #04220e; }
.xpt.dead { opacity: .45; }
/* baie de brassage */
.patch-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 12px; align-items: start; }
.patch-field svg { display: block; }
.patch-field .jack { cursor: pointer; }
.patch-field .jack:focus-visible circle:first-child { stroke: var(--amber); stroke-width: 3; }
.patch-list { max-height: 60vh; overflow: auto; }
.patch-list .item { padding: 4px 8px; }
@media (max-width: 1000px) { .patch-grid { grid-template-columns: minmax(0, 1fr); } }
/* photos du matériel (espace formateur) */
.photo-view, .photo-edit { position: relative; display: block; width: 100%; line-height: 0; border-radius: 6px; overflow: hidden; background: #000; }
.photo-view img, .photo-edit img { width: 100%; height: auto; display: block; }
.photo-edit { cursor: crosshair; }
.hs { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid #fff; background: var(--amber); color: #15100a; font: 700 12px/1 var(--f-mono); box-shadow: 0 0 0 3px rgba(0,0,0,.45), 0 0 12px rgba(255,176,32,.7); display: grid; place-items: center; padding: 0; }
.hs.on { background: var(--cyan); }
.photo-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(240px, 1fr); gap: 12px; align-items: start; }
.item.review[data-s="ok"] { border-color: #1f7a3c; } .item.review[data-s="fix"] { border-color: #8a2a24; }
.item.review input { width: 100%; margin-top: 6px; }
textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: 4px; padding: 6px 8px; color: var(--fg); font: inherit; resize: vertical; }
@media (max-width: 800px) { .photo-grid { grid-template-columns: minmax(0, 1fr); } }
/* scénario jour de match */
.scenario { position: fixed; z-index: 5; right: var(--gut-r); top: calc(110px + env(safe-area-inset-top, 0px)); width: min(360px, calc(100vw - 32px)); background: rgba(11,14,17,0.94); border: 1px solid var(--amber); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.scenario .sc-head { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }

d:"comm",label:"Positions commentateurs",zone:"Tribune Lepagnot",pos:[11.5,12.9,-62.6],types:["ptz"],role:"comm",precab:!0,desc:"Plan des commentateurs."},{id:"drone",label:"Drone – zone de vol derrière Marek-Xercès",zone:"Extérieur",pos:[-40,58,75],types:["drone"],role:"beaute",precab:!1,desc:"Vol autorisé uniquement hors du public, avec télépilote certifié."}],Ra=[{id:"ant_main",label:"Antenne toit Lepagnot",pos:[0,35.5,-44],gain:13,kind:"secteur",on:!0},{id:"ant_opp",label:"Antenne toit Marek-Xercès",pos:[0,34.5,44],gain:13,kind:"secteur",on:!1},{id:"ant_l",label:"Antenne toit Trannin",pos:[-64,31,0],gain:13,kind:"secteur",on:!1},{id:"ant_r",label:"Antenne toit Delacourt",pos:[64,33,0],gain:13,kind:"secteur",on:!1},{id:"ant_tun",label:"Antenne tunnel / vestiaires",pos:[0,3.6,-64],gain:6,kind:"omni",on:!1},{id:"ant_cpd",label:"Mât antenne du compound",pos:[-4,9,-100],gain:9,kind:"omni",on:!1}],Ni={QPSK:2,"16QAM":4,"64QAM":6},Gi={"1/2":.5,"2/3":2/3,"3/4":.75,"5/6":5/6,"7/8":7/8},Dc={QPSK:{"1/2":3.1,"2/3":4.9,"3/4":5.9,"5/6":6.9,"7/8":7.7},"16QAM":{"1/2":8.8,"2/3":11.1,"3/4":12.5,"5/6":13.5,"7/8":13.9},"64QAM":{"1/2":14.4,"2/3":16.5,"3/4":18,"5/6":19.3,"7/8":20.1}},Ui={"1/4":.25,"1/8":.125,"1/16":1/16,"1/32":1/32};function Oc(e,t,s,n){return 4.98*(Ni[e]/2)*(Gi[t]/.5)*(1.25/(1+Ui[s]))*(n/8)}var qc=[10,50,100,250,500,1e3];function Nc(){let e=[];for(let t=2030;t<=2490;t+=10){let s="libre",n="";[2150,2190,2230,2330,2350].includes(t)&&(s="attrib",n="Attribué à notre production (coordination)"),[2170,2270,2280].includes(t)&&(s="occ",n="Autre diffuseur (liaison HF)"),[2090,2100].includes(t)&&(s="occ",n="Organisateur (vidéo sécurité)"),t>=2400&&(s="wifi",n="Bande ISM 2,4 GHz (Wi-Fi des spectateurs)"),e.push({f:t,status:s,user:n})}return e}var Cs=[{label:"CLEAR",f:1},{label:"1/4 (ND 0.6)",f:1/4},{label:"1/8 (ND 0.9)",f:1/8},{label:"1/16 (ND 1.2)",f:1/16},{label:"1/64 (ND 1.8)",f:1/64}],tr=[{label:"OFF",v:0},{label:"1/100",v:100},{label:"1/250",v:250},{label:"1/500",v:500},{label:"1/1000",v:1e3},{label:"1/2000",v:2e3}],Gc=[-3,0,3,6,9,12],zr=[1.4,1.7,2,2.4,2.8,3.4,4,4.8,5.6,6.7,8,9.5,11,13,16,22],jr={jour:{label:"Après-midi ensoleillé",cct:5600,desc:"Soleil à 35° : une partie de la pelouse est à l'ombre de la tribune. L'ingé vision doit suivre l'iris entre soleil et ombre."},fin:{label:"Fin de journée (soleil rasant)",cct:3600,desc:"Lumière chaude et rasante, grande ombre portée : contraste très fort."},couvert:{label:"Ciel couvert",cct:6500,desc:"Lumière douce et homogène, plus froide, environ 2 diaphragmes de moins qu'en plein soleil."},nuit:{label:"Nuit – éclairage LED du stade",cct:5700,desc:"Éclairage de stade (environ 2000 lux) : environ 5 diaphragmes de moins qu'en plein soleil."}},us={realisateur:{title:"Réalisateur",where:"Régie production – 1er rang, au centre",role:"Le réalisateur raconte le match en images. Il choisit chaque plan, annonce les caméras au truquiste, demande les ralentis aux opérateurs EVS et donne des consignes de cadrage aux cadreurs par l'intercom.",gear:["Multiview (mosaïque de toutes les sources)","Pupitre intercom à touches : appel général caméras, caméra par caméra, EVS, son, production","Parfois un pupitre de réalisation (préparation des sources)"],process:["Avant le match : briefing des cadreurs avec le plan de caméras et les consignes (qui suit quoi)","Pendant le direct : annonce « Prépare la 3 »… puis « Top » ou « Envoie la 3 »","Sur une action : « EVS A, ralenti sur l'action, la 2 et la 7 »","Gère le rythme : plan large majoritaire, serrés sur les moments forts"],tips:["Toujours annoncer une caméra avant de l'envoyer : le cadreur voit son tally vert, il sait qu'il va passer.","Éviter de couper pendant un zoom ou un panoramique rapide.","Le plan large reste la base : le téléspectateur doit toujours savoir où est le ballon.","Ne pas utiliser le contrechamp en direct (inversion de sens) : on le réserve aux ralentis."]},scripte:{title:"Scripte / assistant(e) réalisation",where:"Régie production – à gauche du réalisateur",role:"Gardien(ne) du temps et du conducteur : comptes à rebours, prises d'antenne, coupures publicitaires, timings. Note les temps forts (timecode) pour les ralentis et les résumés.",gear:["Conducteur (déroulé minuté)","Chronomètres, horloge maître (timecode)","Intercom et liaison avec le diffuseur"],process:["Annonce : « Antenne dans 1 minute… 30 secondes… 10, 9, 8… Top antenne »","Suit la durée des séquences et des pubs","Note les actions marquantes avec leur timecode"],tips:["Le timecode vient du générateur de synchro : tout le car est à la même heure."]},melangeur:{title:"Truquiste (opérateur mélangeur)",where:"Régie production – à droite du réalisateur",role:"Exécute en temps réel les commutations demandées par le réalisateur : cut, enchaîné (mix), volet, transitions logo pour les ralentis, incrustations et habillage (DSK). Prépare les effets complexes.",gear:["Dans votre car : mélangeur Sony XVS-6000 (processeur 6U en baie) commandé par un pupitre ICP-X7000 via l'unité d'interface MKS-X7700","Bus A (programme, rouge) et B (preset, vert), levier de transition, MIX / WIPE / DME / CLIP","4 keyers par M/E avec redimensionneur 2,5D, DME 3D en option, DSK (habillage aval)","Frame memory (images et clips de transition), snapshots et Shotbox, multiviewers intégrés"],process:["La source annoncée est sélectionnée sur le bus PST (tally vert sur la caméra)","Au « Top », CUT ou AUTO (transition de durée réglée en images)","Le PST et le PGM s'échangent après chaque transition (flip-flop)","Les DSK (score, logo) restent au-dessus de tout, y compris des ralentis"],tips:["Raccourcis de ce simulateur : chiffres = préparer la source, Maj + chiffre = direct au PGM, Espace = CUT, Entrée = AUTO.","Une durée de mix de 12 à 25 images est courante ; un volet logo dure environ 1 s.","La sortie « clean feed » est le PGM sans les DSK : on la livre aux diffuseurs étrangers."]},habillage:{title:"Habillage (graphiste temps réel)",where:"Régie production – 2e rang",role:"Fait apparaître les éléments graphiques : score et chrono, bandeaux nom des joueurs, compositions, statistiques. Les graphiques sont produits par un moteur temps réel et envoyés au mélangeur sous forme de deux signaux : remplissage (fill) et découpe (key).",gear:["Moteur graphique temps réel (type Vizrt, Chyron, Ross XPression, Singular)","Données externes : chronomètre officiel, fournisseur de statistiques","Sorties fill + key vers les DSK du mélangeur"],process:["Les modèles sont préparés avant le direct (charte graphique du diffuseur)","Le score/chrono est en général permanent (DSK 1)","Les bandeaux sont « cuées » puis jouées sur ordre du réalisateur"],tips:["Si le DSK correspondant n'est pas à l'antenne au mélangeur, le graphique ne se voit pas au PGM."]},producteur:{title:"Producteur / éditorial",where:"Régie production – 2e rang",role:"Représente le diffuseur : contenu éditorial, interventions des consultants, gestion des pubs et des duplex, relations avec la chaîne.",gear:["Intercom, téléphone avec la chaîne, retour antenne"],process:["Valide le conducteur","Décide des séquences (interviews, statistiques, sujets)"],tips:[]},chefdecar:{title:"Chef de car",where:"Régie production – 2e rang / zone technique",role:"Responsable technique du car et de l'installation : configuration (grille, multiview, intercom, tally), coordination de l'équipe technique, essais avec le diffuseur, dépannage pendant le direct, sécurité électrique.",gear:["Synoptique de l'installation","Accès à la grille, aux alarmes, aux mesures","Intercom avec toute l'équipe et le diffuseur (coordination technique)"],process:["Avant : plan de câblage, affectation des CCU, des entrées EVS et du multiview","Line-up : mires, vérification des liaisons, test transmission avec la chaîne","Pendant : surveille les alarmes, anticipe les secours (redondance TX, alimentation)","Après : démontage, rapport technique"],tips:["Poste de contrôle : ouvrez le simulateur de pannes pour vous entraîner au dépannage."]},vision:{title:"Ingénieur(e) vision",where:"Régie vision",role:"Règle l'image de chaque caméra à distance : exposition (iris), niveau de noir, colorimétrie, gain, filtres. Égalise toutes les caméras entre elles (matching) pour que les coupes soient invisibles. Suit la lumière en direct (nuages, ombre et soleil).",gear:["RCP (Remote Control Panel) : un par caméra, joystick iris / noir","MSU / MCP : pupitre maître pour les menus et fichiers de scène","Moniteur de référence Grade 1 (type Sony BVM-HX310) dans une lumière d'ambiance contrôlée","Oscilloscope (waveform) et vecteurscope (type Telestream PRISM, Leader LV5600)"],process:["Line-up : balance des noirs (iris fermé), balance des blancs sur une charte, chargement des fichiers de scène","Matching : même niveau de noir, même balance des blancs, même gamma et même saturation pour toutes les caméras","Direct : « riding » de l'iris en continu, ajustements fins des couleurs"],tips:["Repères : pelouse en plein soleil vers 40-55 %, maillot blanc sous 100 %, noirs à 0-2 %.","Ouvrir l'iris d'un diaphragme double la lumière ; +6 dB de gain aussi, mais avec du bruit.","Au téléobjectif, l'ouverture maximale diminue (ramping) : l'image peut s'assombrir quand le cadreur zoome.","Les caméras super ralenti reçoivent 3 ou 6 fois moins de lumière par image."]},brassage:{title:"Baie de brassage (jackfield)",where:"Zone technique",role:"Panneaux de jacks vidéo, audio et référence placés entre les appareils et la grille : on y dérive, remplace ou contourne une liaison avec un cordon, sans toucher au câblage arrière.",gear:["Jackfields vidéo (prises « normalées » : sans cordon, le signal passe directement)","Cordons de brassage 75 Ω","Liste de câblage et étiquetage des deux extrémités"],process:["Installation : vérifier chaque liaison avec la liste de câblage","Dépannage : brasser une source de secours ou un appareil de remplacement","Toujours remettre les normales après un dépannage, et le noter"],tips:["Un cordon inséré coupe la normale : la destination ne reçoit plus que le cordon.","Erreur classique : caméra brassée sur la mauvaise entrée de grille → nom faux au multiview et tally faux."]},ipdirector:{title:"IPDirector (gestion des médias EVS)",where:"Régie ralentis",role:"Gère la base de données des clips du serveur EVS : log des actions avec mots-clés pendant le direct, nommage et classement des clips, montage de playlists (résumés, meilleurs moments), contrôle des canaux, transferts vers le montage.",gear:["Station de travail IPDirector reliée aux serveurs XT4K (réseau 10 GbE)","Moniteurs des canaux de lecture","Intercom avec l'opérateur ralenti et le réalisateur"],process:["Pendant le jeu : logger chaque action (BUT, TIR, FAUTE…) au bon timecode","Transformer les logs en clips, les nommer, ajouter joueurs et notes","À la mi-temps et à la fin : monter les playlists du résumé et les envoyer à l'antenne ou au montage"],tips:["Un clip créé ici apparaît aussi sur la télécommande LSM (même base de données).","Des mots-clés cohérents (toujours « TIR », jamais « frappe ») rendent la recherche instantanée."]},evs:{title:"Opérateur ralenti (EVS / LSM)",where:"Régie ralentis",role:"Enregistre en permanence plusieurs caméras sur le serveur et sort les ralentis à la demande du réalisateur, avec le bon angle et la bonne vitesse. Prépare aussi les résumés et les moments forts.",gear:["Dans votre car : serveur EVS XT4K (4 canaux UHD ou 8 à 12 canaux HD selon la configuration)","Télécommande LSM (logiciel Multicam) : levier, jog, touches F, IN / OUT, PLST, TAKE","Poste IPDirector : base de données des clips, log, playlists","Moniteurs des sorties de lecture et écran du serveur (clip screen)"],process:["Après une action : retour en arrière, MARK IN quelques secondes avant","Choix de l'angle (toutes les caméras enregistrées sont synchronisées en timecode)","Le réalisateur envoie la sortie EVS au mélangeur, l'opérateur lance la lecture au levier (25 à 50 % le plus souvent)","Pour une caméra super ralenti (3x), 33 % reste parfaitement fluide"],tips:["Une caméra 3x occupe 3 entrées d'enregistrement (une par phase).","Ralentir une caméra 50 i/s à 25 % fait répéter chaque image 4 fois : le mouvement saccade.","Raccourcis : Espace = lecture/pause, I = MARK IN, O = MARK OUT, L = live, flèches = jog image par image."]},son:{title:"Ingénieur(e) du son",where:"Régie son (cabine isolée)",role:"Mixe le son du programme : ambiance des tribunes, micros bord terrain (frappes de balle, coups de sifflet), commentaires. Fournit le son international (sans commentaires), gère les retours des commentateurs (N-1) et la conformité de loudness.",gear:["Console numérique (type Lawo mc², Calrec Artemis/Apollo)","Micros : canons bord terrain, couples d'ambiance en tribune, micros commentateurs","Liaisons MADI / Dante / ST 2110-30, embedding de l'audio dans le SDI","Mesure de loudness (EBU R128)"],process:["Installation des micros par l'équipe son (chef OPS)","Line-up : 1 kHz à -18 dBFS sur toutes les liaisons","Embedder du départ réglé selon le plan de son de la chaîne (PGM, international…)","Retours N-1 des commentateurs et du duplex vérifiés (pas de voix dans son propre retour)","Retard de ligne calé sur l'image (caméra HF comprise)","Direct : équilibre ambiance / effets / commentaires, cible -23 LUFS"],tips:["EBU R128 : -23 LUFS intégré, true peak maximum -1 dBTP.","Le son voyage avec l'image : 16 canaux audio peuvent être embeddés dans un flux SDI HD.","Synchro labiale (EBU R37) : son en avance de 40 ms au plus, en retard de 60 ms au plus."]},hf:{title:"Technicien(ne) HF",where:"Zone technique / car HF",role:"Installe et exploite les liaisons sans fil : émetteurs des caméras HF, antennes réceptrices, récepteurs. Choisit les fréquences attribuées, la modulation et la puissance, surveille la marge de réception.",gear:["Émetteurs COFDM au dos des caméras (type Vislink, Domo/Cobham)","Antennes réceptrices (panneaux secteur, omnidirectionnelles) en toit de tribune, reliées par fibre (RF sur fibre)","Récepteurs en diversité (4 à 8 antennes combinées)","Analyseur de spectre"],process:["Demande de fréquences auprès de la coordination (en France, l'ANFR ou le coordinateur de l'événement)","Pose des antennes pour couvrir toutes les zones (terrain, tunnel, vestiaires)","Réglage modulation / débit / latence, test de couverture en marchant","Surveillance en direct : niveaux, MER, marge"],tips:["64-QAM = beaucoup de débit (belle image) mais demande environ 18 dB de rapport signal/bruit ; QPSK passe partout mais compresse davantage.","Ne jamais utiliser la bande Wi-Fi 2,4 GHz : elle est saturée par les téléphones du public.","Plusieurs antennes en diversité évitent les coupures dues aux évanouissements (fading)."]},grille:{title:"Grille de commutation (router)",where:"Baie technique",role:"La grille relie n'importe quelle source à n'importe quelle destination : entrées du mélangeur, tuiles du multiview, entrées d'enregistrement EVS, départs vers la chaîne, moniteurs. C'est le cœur de la configuration du car.",gear:["Matrice SDI ou IP (type Evertz EQX, Grass Valley NV, Ross Ultrix) de plusieurs centaines d'entrées/sorties","Panneaux de commande X-Y, système de contrôle (broadcast controller)","Gestion des noms de sources (UMD) et du tally"],process:["Choisir la destination, puis la source, puis TAKE","Préparer des « salvos » (configurations complètes) avant le direct"],tips:["Une erreur sur la grille peut envoyer du noir à la chaîne : vérifiez toujours le retour antenne."]},reseau:{title:"Réseau IP ST 2110 (spine-leaf rouge / bleu)",where:"Baie technique — baie « Réseau IP · Multiview » et commutateurs de haut de baie",role:"Dans un car IP, la grille est remplacée par deux réseaux Ethernet indépendants, rouge et bleu, qui transportent chaque flux en double (SMPTE ST 2022-7). Chaque réseau est une fabric spine-leaf : des leaves de haut de baie reçoivent les appareils, deux spines les relient. L'ingénieur réseau configure les commutateurs (VLAN, routage OSPF, multicast PIM-SSM / IGMPv3, PTP, QoS) et surveille la bande passante.",gear:["2 × 2 spines 32 × 100 GbE (QSFP28)","2 × 6 leaves 48 × 25 GbE + 8 × 100 GbE, une par zone (caméras, production, ralentis, monitoring, audio, passerelles)","Grands maîtres PTP GPS (ST 2059-2) raccordés aux spines","Commutateur de contrôle / gestion (NMOS, RCP, supervision)","Contrôleur NMOS (IS-04 / IS-05) et, souvent, un contrôleur SDN"],process:["Avant l'exploitation : vérifier les voisins OSPF et PIM, le grand maître élu, les ports en erreur","Contrôler que chaque réception est protégée (deux réseaux) et qu'aucun lien n'est saturé","Toute modification : la tester, puis « write memory »","En panne : couche 1 → VLAN → IP / OSPF → multicast → PTP → NMOS"],tips:["Une panne d'un seul réseau ne se voit pas à l'image : surveillez les alarmes.","Un lien saturé dégrade tous les flux qui le traversent.","Un appareil qui n'est pas « slave only » peut se faire élire grand maître PTP."]},ccu:{title:"Baie CCU (voies caméras)",where:"Baie technique",role:"Chaque caméra a sa CCU (Camera Control Unit) dans le car. La CCU alimente la caméra par le câble, reçoit l'image, renvoie le retour vidéo, l'intercom, le tally et la référence, et relaie les réglages du RCP.",gear:["CCU (type Sony HDCU, GV XCU) avec connecteur SMPTE ou triax","Adaptateurs fibre SM pour le pré-câblage","Sorties 12G/3G-SDI ou IP vers la grille"],process:["Mise sous tension caméra par caméra (vérifier le niveau optique reçu)","Vérifier la référence (genlock) et le format","Barres caméra pour identifier chaque liaison"],tips:["Niveau optique typique sur une fibre : -5 à -15 dBm. En dessous d'environ -20 dBm, la liaison décroche."]},synchro:{title:"Générateur de synchro (SPG) et timecode",where:"Baie technique",role:"Tous les équipements doivent être synchronisés sur la même référence pour pouvoir commuter sans saut d'image. Le SPG fournit cette référence, l'heure (timecode) et l'horloge audio.",gear:["SPG (type Telestream/Tektronix SPG8000A, Evertz 5601) verrouillé sur le GPS","Sorties black burst et tri-level, LTC, word clock audio, PTP (grand maître) pour l'IP","Généralement doublé (principal + secours avec bascule automatique)"],process:["Toutes les CCU, le mélangeur, les EVS, les multiviews reçoivent la référence","Les sources externes non synchrones passent par un synchroniseur d'images"],tips:["Sans genlock, une source « saute » ou roule à la commutation.","Le timecode commun permet de retrouver la même action sur toutes les caméras EVS."]},transmission:{title:"Transmission vers le diffuseur",where:"Baie technique / car satellite",role:"Le programme (PGM avec son) est envoyé à la chaîne : c'est la contribution. On utilise en général deux chemins indépendants (principal et secours) et on contrôle le retour antenne.",gear:["Encodeurs (HEVC, JPEG XS) ou liaisons non compressées","Fibre opérateur, réseau IP managé, DSNG (camion satellite)","Récepteur du retour antenne"],process:["Test de ligne : mire + 1 kHz, identification (ident), vérification de la qualité","Pendant le direct : surveiller le retour antenne"],tips:["Le retour antenne arrive avec un délai (encodage, satellite environ 250 ms par bond, décodage). Ne jamais réaliser en regardant le retour."]},intercom:{title:"Intercom (ordres)",where:"Baie technique + pupitres à chaque poste",role:"Le système d'ordres relie toute l'équipe : réalisateur, cadreurs (par la CCU), EVS, son, production, chaîne, commentateurs. C'est vital : sans intercom, pas de réalisation.",gear:["Matrice numérique (type Riedel Artist, Clear-Com Eclipse)","Pupitres à touches à chaque poste, beltpacks sans fil (type Riedel Bolero)","Liaisons 4 fils vers la chaîne et les commentateurs"],process:["Configuration des touches par poste avant le direct","Test de chaque position"],tips:["Les cadreurs entendent l'ordre via leur casque branché sur la caméra (canal transporté par la fibre SMPTE)."]},pieddecar:{title:"Pied de car (panneau de raccordement)",where:"Côté extérieur du car",role:"Tous les câbles arrivent ici : caméras (SMPTE, triax, fibres), audio (multipaires, MADI), intercom, transmissions, énergie. Le panneau est relié en interne à la baie technique.",gear:["Embases SMPTE 3K.93C, triax, fibres LC/ST/Opticalcon, BNC","Prises énergie (P17 32/63/125 A tri) et borne de terre"],process:["Repérer chaque câble (étiquettes) et suivre le plan de câblage","Protéger les connecteurs (bouchons), ne pas laisser de câble sous tension en passage"],tips:["Une connexion SMPTE sale (poussière sur la fibre) peut faire chuter le niveau optique : nettoyer avant de brancher."]},energie:{title:"Énergie",where:"Compound",role:"Le car consomme des dizaines de kW. Il est alimenté par le réseau du stade ou un groupe électrogène, avec un onduleur pour tenir pendant une bascule.",gear:["Groupe électrogène (plusieurs centaines de kVA), tableau de distribution","Onduleur (UPS) dans le car","Mise à la terre (piquet de terre)"],process:["Raccordement et vérification de la terre avant toute mise sous tension","Mesure des tensions et de l'équilibre des phases"],tips:["Prévoir toujours un secours : groupe + réseau, ou deux groupes."]},cadreur:{title:"Cadreur (OPV)",where:"Positions caméras dans le stade",role:"Le cadreur (opérateur de prise de vue) cadre et fait le point selon les consignes du réalisateur, qu'il entend dans son casque. Il voit dans son viseur son image, le tally, et peut basculer sur le retour programme.",gear:["Caméra + objectif, viseur, télécommandes zoom et point","Casque intercom","Tally rouge (à l'antenne) et vert (préparé)"],process:["Installation et réglage de la tête (équilibre), test avec la vision","Pendant le direct : anticiper l'action, garder un cadre propre quand le tally est rouge"],tips:["Tally rouge : pas de mouvement brusque, pas de recadrage.","Le doubleur (x2) double la focale mais fait perdre 2 diaphragmes."]},antenne:{title:"Antenne de réception HF",where:"Toit, tunnel, compound",role:"Reçoit le signal des émetteurs HF des caméras. Le signal est ramené au car par fibre. Plusieurs antennes sont combinées en diversité.",gear:["Antenne panneau secteur (gain élevé, directive) ou omnidirectionnelle","Préamplificateur et convertisseur RF/fibre"],process:["Viser la zone à couvrir, éviter les masques (béton, tribunes)"],tips:["Le béton et les tribunes atténuent fortement le signal : une antenne dans le tunnel est indispensable pour suivre les joueurs depuis les vestiaires."]},localtv:{title:"Local technique TV du stade",where:"Sous la tribune Lepagnot (principale)",role:"Point d'arrivée du pré-câblage du stade : les fibres et câbles des positions caméras et commentateurs aboutissent ici, sur des panneaux de brassage. On y raccorde les câbles venant du compound.",gear:["Panneaux de brassage fibre, multipaires audio, prises SMPTE pré-installées"],process:["Vérifier l'état des fibres (mesure de perte) lors du repérage"],tips:["Le pré-câblage évite des centaines de mètres de tirage de câbles, mais transporte rarement l'alimentation."]},commentateurs:{title:"Cabine des commentateurs",where:"Tribune de presse",role:"Les commentateurs voient le terrain et un moniteur du programme. Leur unité de commentaire (micros-casques) envoie leur voix au car et reçoit un retour N-1 et les ordres.",gear:["Unité de commentaire (type Glensound)","Moniteur PGM, liaison 4 fils / IP vers le car"],process:["Test des micros et des retours au line-up"],tips:["Le retour N-1 contient tout le programme sauf leur propre voix, pour éviter l'écho."]},var:{title:"Assistance vidéo (VAR)",where:"Salle VAR (stade ou centre déporté)",role:"Les arbitres vidéo reçoivent les flux de nombreuses caméras du car (dont les super ralentis et les caméras hors-jeu) sur leurs propres serveurs de relecture.",gear:["Serveurs de relecture dédiés, liaisons depuis la grille du car"],process:["Le car livre des sorties ISO de caméras à la VAR"],tips:[]}},Uc=[["SDI","Serial Digital Interface : vidéo numérique non compressée sur câble coaxial 75 Ω (BNC). HD-SDI 1,485 Gb/s (SMPTE ST 292), 3G-SDI 2,97 Gb/s (ST 424) pour le 1080p50, 12G-SDI 11,88 Gb/s (ST 2082) pour l'UHD sur un seul câble. Transporte aussi l'audio embeddé (16 canaux), le timecode et des données."],["Quad-link / 2SI","UHD transporté sur 4 liens 3G-SDI : découpage en quadrants (Square Division) ou entrelacement de 2 échantillons (2SI)."],["ST 2110-21","Norme de régularité d'émission des paquets vidéo : émetteurs de type N (étroit, paquets réguliers) ou W (large, rafales), avec deux limites mesurables : CMAX et VRX_FULL."],["CMAX / CINST","CINST : nombre de paquets arrivés en avance sur le rythme régulier (rafale instantanée). Il doit rester sous CMAX, calculé pour le format et le type d'émetteur."],["VRX_FULL","Taille du tampon du « récepteur virtuel » de ST 2110-21. Si le remplissage mesuré la dépasse, un récepteur conforme peut perdre des paquets."],["RFC 4175","Format RTP de la vidéo non compressée utilisé par ST 2110-20 : chaque paquet indique sa ligne et son décalage en pixels."],["Numéro de séquence RTP","Compteur de 16 bits incrémenté à chaque paquet : un trou dans la suite signale des paquets perdus."],["SPAN / port miroir","Fonction d'un commutateur qui recopie le trafic d'un port vers un autre, où l'on branche un analyseur (monitor session)."],["MAC multicast","01:00:5e suivi des 23 bits de poids faible de l'adresse du groupe IPv4 : 32 groupes partagent une même adresse MAC."],["Offset PTP","Écart entre l'horloge d'un appareil et celle de son maître, mesuré à chaque message Sync. Quelques dizaines de ns quand tout va bien."],["Écart 2022-7","Différence de temps de traversée entre les réseaux rouge et bleu, que le récepteur doit absorber dans son tampon de fusion."],["Spine-leaf","Architecture de réseau à deux étages (réseau de Clos) : chaque leaf (commutateur d'accès) est reliée à chaque spine (commutateur de cœur). Tout chemin fait leaf → spine → leaf."],["Leaf / ToR","Commutateur d'accès placé en haut de baie (Top of Rack), où se raccordent les appareils (25 GbE, 100 GbE)."],["Réseaux rouge et bleu","Les deux réseaux média indépendants (A et B) d'une installation ST 2022-7 : chaque flux est émis sur les deux, sans aucun lien entre eux."],["VLAN","Réseau local virtuel (IEEE 802.1Q) : découpe un commutateur en domaines de niveau 2 séparés. Ici, un VLAN média par leaf."],["SVI","Switch Virtual Interface (interface VlanN) : adresse IP du commutateur dans un VLAN, passerelle des appareils et querier IGMP."],["OSPF","Open Shortest Path First : protocole de routage à état de liens. Voisins en « FULL » quand tout va bien ; une MTU différente les bloque en EXSTART."],["ECMP","Equal-Cost Multi-Path : répartition du trafic sur plusieurs chemins de même coût (les uplinks d'une leaf), par hachage."],["PIM-SSM","Protocol Independent Multicast en Source-Specific Multicast : le récepteur demande un flux (S,G) précis ; pas de point de rendez-vous. Plage SSM par défaut 232.0.0.0/8."],["IGMPv3","Protocole par lequel un récepteur s'abonne à un groupe multicast, en précisant la source (S,G). IGMPv2 ne connaît que (*,G)."],["Snooping IGMP","Le commutateur écoute les rapports IGMP pour n'envoyer chaque flux multicast que sur les ports abonnés. Sans snooping : inondation."],["Querier IGMP","Équipement qui interroge périodiquement les récepteurs pour entretenir les abonnements. Sans querier, les entrées expirent (≈ 260 s par défaut)."],["(S,G)","Couple source / groupe d'un flux multicast, par exemple (10.1.1.20, 239.1.1.1)."],["RPF","Reverse Path Forwarding : le routeur n'accepte un flux multicast que s'il arrive par l'interface menant à la source dans sa table de routage."],["MTU","Taille maximale d'une trame. Les paquets ST 2110 font ≈ 1 400-1 500 octets ; les liens de cœur sont souvent en 9 214 (jumbo)."],["RS-FEC","Correction d'erreurs Reed-Solomon, attendue à 25 GbE et 100 GbE sur fibre courte. Une FEC différente aux deux bouts empêche le lien de monter."],["BMCA","Best Master Clock Algorithm (PTP) : élection du grand maître par priority1, clockClass, précision, variance, priority2 puis identité."],["Horloge frontière (BC)","Boundary clock : commutateur qui se cale sur son maître PTP et redistribue l'heure sur ses autres ports."],["SDP","Session Description Protocol : fichier texte décrivant un flux (adresses, format, horloge). Transmis par NMOS IS-05 au récepteur."],["a=group:DUP","Ligne SDP (RFC 7104) qui regroupe les deux jambes d'un flux ST 2022-7 (primary sur le réseau rouge, secondary sur le bleu)."],["Contrôleur SDN","Logiciel qui pilote le réseau en connaissant la topologie et la capacité des liens : il réserve la bande passante et refuse une connexion impossible."],["running / startup-config","Configuration active d'un commutateur / configuration rechargée au démarrage. « write memory » copie la première dans la seconde."],["DSCP","Champ de priorité de l'en-tête IP. Plan type : PTP 46 (EF), audio 34 (AF41), vidéo 26 (AF31)."],["SMPTE ST 2110","Transport de la vidéo (-20), de l'audio (-30) et des données (-40) non compressés sur IP en flux séparés, synchronisés par PTP."],["PTP","Precision Time Protocol (IEEE 1588 / SMPTE ST 2059) : la référence de synchronisation des installations IP, fournie par un grand maître."],["Genlock / référence","Verrouillage de tous les équipements sur le même signal de synchronisation venant du SPG. Sans genlock, commuter entre deux sources provoque un saut d'image."],["Black burst / tri-level","Signaux de référence : black burst (analogique 625 lignes) et tri-level (HD, impulsion à trois niveaux)."],["SPG","Sync Pulse Generator : générateur de synchro, souvent asservi au GPS. Fournit référence, timecode, horloge audio et PTP."],["Timecode","Heure codée HH:MM:SS:II (heures, minutes, secondes, images). 25 images par seconde en Europe (50 Hz)."],["CCU","Camera Control Unit : voie caméra dans le car. Alimente la caméra, reçoit l'image, renvoie retour vidéo, intercom, tally et référence."],["RCP","Remote Control Panel : pupitre de réglage d'une caméra par l'ingénieur vision (iris, noir, blancs, gain…)."],["MSU / MCP","Pupitre maître de configuration de toutes les caméras (menus, fichiers de scène)."],["Tally","Lampe rouge (à l'antenne) ou verte (préparée) sur la caméra, le viseur et le multiview, pilotée par le mélangeur."],["UMD","Under Monitor Display : étiquette de nom de source sous chaque image du multiview."],["Multiview","Processeur qui affiche de nombreuses sources sur un écran, avec étiquettes, tally, horloges, vumètres et alarmes (perte de signal, image figée, noir)."],["Mélangeur","Vision mixer / switcher : commute et mélange les sources. Bus PGM/PST, transitions, keyers, DVE, DSK."],["PGM / PST","Programme (ce qui est à l'antenne, tally rouge) et Preset ou Preview (ce qui est prêt à passer, tally vert)."],["M/E","Mix/Effect : étage de mélange. Les grands mélangeurs en ont 3 à 5 pour préparer des effets."],["DSK","Downstream Keyer : incrustation en aval des M/E, pour l'habillage permanent (score, logo)."],["Clean feed","Programme sans habillage (sans DSK), livré aux diffuseurs qui ajoutent leurs propres graphiques."],["Signal international","Image + son international (ambiance sans commentaire) livrés à tous les diffuseurs."],["DVE","Digital Video Effects : redimensionnement et déplacement d'image (image dans l'image, PiP)."],["Fill / Key","Les deux signaux d'un graphique : l'image (fill) et sa découpe noir et blanc (key)."],["Volet logo / stinger","Transition animée avec le logo, utilisée pour entrer et sortir des ralentis."],["Serveur ralenti (EVS)","Serveur qui enregistre en boucle plusieurs caméras et permet de relire n'importe quel moment, à n'importe quelle vitesse."],["LSM","Live Slow Motion : télécommande du serveur ralenti avec levier de vitesse et molette jog."],["MARK IN / OUT","Points d'entrée et de sortie d'un clip."],["HFR / super ralenti","High Frame Rate : caméra à 150 i/s (3x) ou 300 i/s (6x). Chaque phase sort sur une sortie SDI enregistrée par l'EVS, d'où des ralentis fluides."],["Grille / router","Matrice de commutation : n'importe quelle source vers n'importe quelle destination."],["Jackfield / patch","Panneau de brassage manuel (BNC, fibres) pour les secours et les dépannages."],["Synchroniseur d'images","Frame sync : remet en phase une source externe non verrouillée."],["Embedding","Insertion de l'audio dans le flux SDI (et désembedding : extraction)."],["Plan de son","Affectation demandée par le diffuseur : quel son sur quelle paire du SDI (ex. 1-2 PGM stéréo, 3-4 international)."],["Son international","Mix d'ambiance et d'effets sans aucune voix, livré aux diffuseurs étrangers qui y ajoutent leurs commentaires."],["Synchro labiale","Alignement du son sur l'image (lip-sync). Tolérance EBU R37 : son en avance de 40 ms au plus, en retard de 60 ms au plus."],["Retard de ligne","Retard ajouté au son pour compenser la latence de l'image (codec HF, conversions, synchroniseurs)."],["MADI","AES10 : 64 canaux audio numériques sur un coaxial ou une fibre."],["N-1","Mix-minus : retour audio contenant tout le programme sauf la voix de celui qui l'écoute."],["HDR / HLG","Haute dynamique. HLG (Hybrid Log-Gamma, ITU-R BT.2100) est le plus utilisé en direct ; on dérive souvent le SDR (BT.709) depuis le HDR."],["BT.709 / BT.2020","Espaces colorimétriques de la HD et de l'UHD."],["Waveform","Oscilloscope de forme d'onde : niveau de luminance de chaque colonne de l'image, de 0 % (noir) à 100 % (blanc nominal, 700 mV)."],["Vecteurscope","Affiche la chrominance : l'angle donne la teinte, la distance au centre la saturation. Un blanc ou un gris parfaitement balancé est au centre."],["Super-blancs","Niveaux au-dessus de 100 %, jusqu'à 109 % (écrêtage). À éviter dans le programme."],["Iris / diaphragme","Ouverture de l'objectif : f/1.7 très ouvert, f/16 fermé. Un diaphragme (stop) double ou divise par deux la lumière."],["Ramping","Perte de luminosité d'un zoom en longue focale (par exemple f/1.7 qui devient f/4.4 au maximum du zoom)."],["Doubleur","Extender x2 intégré au zoom : double la focale, fait perdre 2 diaphragmes."],["Angle de champ",'Angle horizontal = 2 × arctan(largeur capteur / (2 × focale)). Pour un capteur 2/3" (9,59 mm) : 58° à 8,6 mm, 1,4° à 400 mm.'],["Filtre ND","Densité neutre : réduit la lumière sans changer les couleurs (1/4 = -2 diaphragmes)."],["Balance des blancs","Égalisation des gains rouge et bleu pour qu'un blanc soit neutre sous la lumière du moment."],["Balance des noirs","Égalisation des niveaux de noir R/V/B, iris fermé."],["Knee","Compression des hautes lumières pour garder du détail dans les blancs."],["Detail","Accentuation électronique des contours."],["Gain","Amplification du signal en dB : +6 dB = un diaphragme de plus, mais plus de bruit."],["Shutter","Obturateur électronique : temps d'exposition plus court, moins de flou de bougé, moins de lumière."],["Scintillement (flicker)","Les lampes à décharge alimentées en 50 Hz pulsent 100 fois par seconde. Invisible à 50 i/s, mais visible en super ralenti si l'éclairage n'est pas « flicker-free »."],["Matching","Égaliser toutes les caméras (niveaux, noirs, couleurs) pour que les coupes soient invisibles."],["COFDM","Modulation multiporteuse très robuste aux échos (celle de la TNT, DVB-T), utilisée par les liaisons HF caméras."],["QPSK / 16-QAM / 64-QAM","Ordres de modulation : plus il est élevé, plus le débit est grand, mais plus il faut de rapport signal/bruit."],["FEC","Correction d'erreurs (1/2 … 7/8) : un taux faible (1/2) est plus robuste mais réduit le débit utile."],["Intervalle de garde","Temps de protection entre symboles OFDM contre les échos (1/4 à 1/32)."],["C/N, MER","Rapport porteuse/bruit et taux d'erreur de modulation : la « santé » d'une liaison HF, en dB."],["Diversité","Réception combinée sur plusieurs antennes pour éviter les coupures."],["Latence","Retard introduit par l'encodage et le décodage (HF, IP compressé, satellite)."],["DSNG","Digital Satellite News Gathering : camion d'émission satellite."],["Contribution","Liaison du car vers la chaîne (fibre, IP, satellite)."],["Retour antenne","Le signal tel qu'il est diffusé, reçu en retour pour contrôle."],["EBU R128","Recommandation de loudness : -23 LUFS intégré, true peak ≤ -1 dBTP."],["Car régie","OB van (Outside Broadcast) : régie mobile complète dans un semi-remorque, souvent extensible."],["Compound","Parc technique où stationnent les cars, groupes et camions satellites."],["Pré-câblage","Infrastructure fibre/cuivre installée à demeure dans le stade entre les positions et le local TV."],["Conducteur","Déroulé minuté de l'émission."],["Line-up","Phase de réglages et de tests avant le direct (mires, alignement, matching, transmissions)."],["Mire","Signal de test : barres de couleur et 1 kHz à -18 dBFS pour aligner les niveaux."],["ISO","Enregistrement ou sortie isolée d'une caméra."],["CNS (camera network system)","Réseau des caméras système : relie CCU, RCP et pupitre maître (MSU/MCP) en Ethernet et gère quel pupitre commande quelle caméra."],["PANEL ACTIVE","Touche du RCP qui autorise ou verrouille les réglages. Éteinte, les potentiomètres ne font plus rien : on protège une caméra réglée."],["CAM PW","Touche du RCP qui commande l'alimentation de la tête de caméra par la CCU, à travers la fibre hybride. On coupe toujours avant de débrancher un câble caméra."],["CALL","Appel : fait clignoter le tally du cadreur (et du RCP) pour attirer son attention sans parler sur l'ordre général."],["PREVIEW (RCP)","Envoie la caméra du RCP sur le moniteur de référence de la vision, via une sortie AUX de la grille."],["CHARACTER (sortie)","Sortie vidéo de la CCU avec incrustation des menus et des informations de la caméra, pour un moniteur de contrôle."],["Flare","Voile de lumière parasite dans l'optique qui relève les noirs. La compensation de flare (R/G/B) le corrige."],["Black gamma","Réglage qui relève ou écrase les basses lumières sans toucher au noir ni au blanc : utile pour déboucher les ombres."],["Master black / pedestal","Niveau du noir pour le
