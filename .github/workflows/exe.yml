# TIEE-Simulator.exe, construit par GitHub : la page du simulateur chiffrée par le mot de passe
# (secret TIEE_MDP), l'exécutable signé si un certificat est donné (secrets TIEE_SIGN_CERT,
# TIEE_SIGN_KEY, et TIEE_SIGN_KEY_MDP si la clé en a un), vérifié (lancé, mot de passe essayé,
# signature contrôlée par osslsigncode), puis :
#   · à l'envoi d'une étiquette de version (git tag v19.10.0 && git push origin v19.10.0) :
#     publié dans les « Releases » du dépôt (exécutable et kit) ;
#   · lancé à la main (onglet Actions, « Run workflow ») : gardé 30 jours dans les fichiers de l'exécution.
# Sans le mot de passe, ces fichiers ne donnent rien : l'exécutable ne contient la page que chiffrée.
# Secrets : Settings → Secrets and variables → Actions → New repository secret (README.md, « Exécutable protégé »).
name: Exécutable Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # publier la version

jobs:
  exe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification de la signature (osslsigncode)
        run: sudo apt-get install -y --no-install-recommends osslsigncode
      - name: Mot de passe présent
        env:
          TIEE_MDP: ${{ secrets.TIEE_MDP }}
        run: |
          if [ -z "$TIEE_MDP" ]; then echo "::error title=Secret manquant::Ajoutez le secret TIEE_MDP (Settings → Secrets and variables → Actions) : l'exécutable chiffre la page avec ce mot de passe."; exit 1; fi
      - run: npm run build
      - name: Exécutable chiffré, signé, vérifié
        env:
          TIEE_MDP: ${{ secrets.TIEE_MDP }}
          TIEE_SIGN_CERT: ${{ secrets.TIEE_SIGN_CERT }}
          TIEE_SIGN_KEY: ${{ secrets.TIEE_SIGN_KEY }}
          TIEE_SIGN_KEY_MDP: ${{ secrets.TIEE_SIGN_KEY_MDP }}
        run: node tools/exe.mjs --verifier
      - name: Empreintes
        run: cd dist && sha256sum TIEE-Simulator.exe TIEE-Simulator-partage.zip | tee SHA256SUMS.txt
      - name: Publication de la version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/TIEE-Simulator.exe dist/TIEE-Simulator-partage.zip dist/SHA256SUMS.txt \
            --title "TIEE Simulator $GITHUB_REF_NAME" \
            --notes "Exécutable Windows protégé par mot de passe (demandez-le à votre formateur). Mode d'emploi : LISEZMOI.txt dans le kit. Empreintes SHA-256 : SHA256SUMS.txt."
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: TIEE-Simulator
          retention-days: 30
          path: |
            dist/TIEE-Simulator.exe
            dist/TIEE-Simulator-partage.zip
            dist/SHA256SUMS.txt
